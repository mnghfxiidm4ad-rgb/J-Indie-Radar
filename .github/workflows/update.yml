name: Daily Japanese indie scan

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch up to 3 new dossiers and rebuild
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash' }}
          SITE_URL: ${{ vars.SITE_URL }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          GOOGLE_FORM_EMBED_URL: ${{ vars.GOOGLE_FORM_EMBED_URL }}
          ADSENSE_CLIENT_ID: ${{ vars.ADSENSE_CLIENT_ID }}
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
        run: python scripts/fetch_and_summarize.py --update --max 3

      - name: Commit published site
        run: |
          git config user.name "j-indie-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data/games.json
          if git diff --staged --quiet; then
            echo "No site changes"
          else
            git commit -m "chore: daily radar scan (JST 10:00)"
            git push
          fi
